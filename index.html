
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Science of Magenta</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, sans-serif;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, red, limegreen, magenta);
      background-size: 300% 300%;
      animation: chaos 6s ease infinite;
    }

    @keyframes chaos {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      padding: 40px;
      border: 3px solid white;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px #0005;
    }

    h1 { font-size: 3rem; margin-bottom: 10px; }
    .equation {
      font-size: 2rem;
      font-weight: 900;
      margin: 30px 0;
    }

    .red { color: #ff5555; }
    .green { color: #7cff7c; }
    .magenta { color: #ff4dff; }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #d000a8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧪 MAGENTA LAB</h1>
    <p>Question everything. Especially colors.</p>

    <div class="equation">
      <span class="red">RED</span>
      +
      <span class="green">GREEN</span>
      =
      <span class="magenta">MAGENTA</span>
    </div>

    <p>Peer reviewed by absolutely nobody.</p>
    <p>100% scientifically questionable.</p>

    <button onclick="alert('Congratulations. You understand color theory now. 🎓')">
      Verify Science
    </button>

    <p style="font-size: 12px; opacity: .7; margin-top: 25px">
      © 2026 Magenta Institute of Alternative Physics
    </p>
  </div>
</body>
</html>
